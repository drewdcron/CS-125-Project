<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YGMS Guest Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    /* GUEST THEME: Lighter, Mobile Friendly */
    :root { --primary: #0ea5e9; --bg: #f8fafc; --text: #334155; --success: #22c55e; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; height: 100vh; overflow: hidden; }

    .sidebar { width: 280px; background: white; border-right: 1px solid #e2e8f0; padding: 25px; display: flex; flex-direction: column; gap: 20px; }
    .logo { font-size: 1.5rem; font-weight: 800; color: var(--primary); letter-spacing: -1px; margin-bottom: 10px; }

    label { font-size: 0.75rem; text-transform: uppercase; color: #94a3b8; margin-bottom: 5px; display: block; }
    select { width: 100%; padding: 12px; border-radius: 8px; background: #f1f5f9; border: 1px solid #cbd5e1; outline: none; }

    .main { flex-grow: 1; padding: 40px; overflow-y: auto; max-width: 800px; margin: 0 auto; }
    .header { margin-bottom: 30px; }
    h1 { font-size: 1.8rem; color: #0f172a; margin: 0; }

    /* Event List Item */
    .event-item { background: white; padding: 25px; border-radius: 12px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border-left: 5px solid var(--primary); }
    .event-item h3 { margin: 0; font-size: 1.2rem; }

    /* Profile Form */
    .form-box { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    .form-group { margin-bottom: 20px; }
    input, textarea { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; background: #f8fafc; font-family: inherit; box-sizing: border-box; }

    /* Buttons */
    .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; transition: transform 0.1s; }
    .btn:active { transform: scale(0.98); }
    .btn-rsvp { background: var(--primary); color: white; width: auto; padding: 10px 25px; }
    .btn-nav { background: #f1f5f9; color: #475569; text-align: left; }
    .btn-nav:hover { background: #e2e8f0; }
    .btn-save { background: var(--success); color: white; font-size: 1rem; margin-top: 10px; }
  </style>
</head>
<body>

  <aside class="sidebar">
    <div class="logo">👋 WELCOME</div>

    <div>
      <label>I am:</label>
      <select id="userSelector" onchange="currentUserId = this.value"></select>
    </div>

    <hr style="border:0; border-top:1px solid #e2e8f0; width:100%;">

    <button class="btn btn-nav" onclick="renderEvents()">📅 Upcoming Events</button>
    <button class="btn btn-nav" onclick="renderProfile()">👤 My Profile / Medical</button>
  </aside>

  <main class="main">
    <div class="header">
      <h1 id="pageTitle">Upcoming Events</h1>
      <p id="pageSubtitle" style="color:#64748b;">Select an event below to RSVP</p>
    </div>

    <div id="contentArea"></div>
  </main>

  <script>
    const API_URL = "/graphql";
    let currentUserId = null;

    async function sendGQL(query) {
      const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ query }) });
      return (await res.json()).data;
    }

    async function init() {
      // 1. Load Guests Only
      const userData = await sendGQL(`query { people { id name role } }`);
      const userSel = document.getElementById('userSelector');
      userData.people.forEach(u => {
        if (u.role !== 'Leader' && !u.role.includes('Pastor')) {
           userSel.innerHTML += `<option value="${u.id}">${u.name}</option>`;
        }
      });
      // Set default ID
      currentUserId = userSel.value;

      // 2. Load View
      renderEvents();
    }

    async function renderEvents() {
  document.getElementById('pageTitle').innerText = "Upcoming Events";
  document.getElementById('pageSubtitle').innerText = "Select an event to RSVP";

  // 1. Ask for 'status'
  const data = await sendGQL(`query { getAllEvents { id name status } }`);
  const container = document.getElementById('contentArea');
  container.innerHTML = "";

  if(data && data.getAllEvents && data.getAllEvents.length > 0) {
    data.getAllEvents.forEach(e => {
        // 2. Filter by 'status'
        if (e.status === 'Active' || !e.status) {
            container.innerHTML += `
              <div class="event-item">
                <div>
                  <h3>${e.name}</h3>
                  <span style="color:#94a3b8; font-size:0.9rem;">Event ID: ${e.id}</span>
                </div>
                <button class="btn btn-rsvp" onclick="rsvp(${e.id})">RSVP</button>
              </div>
            `;
        }
    });
  } else {
    container.innerHTML = "<p>No upcoming events.</p>";
  }
}

    async function renderProfile() {
      document.getElementById('pageTitle').innerText = "My Profile";
      document.getElementById('pageSubtitle').innerText = "Manage medical info (Saved to MongoDB)";
      const container = document.getElementById('contentArea');
      container.innerHTML = "Loading...";

      const data = await sendGQL(`query { getStudentProfile(studentId: ${currentUserId}) }`);
      const p = JSON.parse(data.getStudentProfile || "{}");

      container.innerHTML = `
        <div class="form-box">
            <div class="form-group"><label>Allergies</label><input id="pAllergies" value="${p.allergies||''}"></div>
            <div class="form-group"><label>Meds/Conditions</label><textarea id="pMeds" rows="3">${p.medical||''}</textarea></div>
            <div style="display:flex; gap:15px;">
                <div class="form-group" style="flex:1;"><label>Emergency Name</label><input id="pName" value="${p.contactName||''}"></div>
                <div class="form-group" style="flex:1;"><label>Emergency Phone</label><input id="pPhone" value="${p.contactPhone||''}"></div>
            </div>
            <button class="btn btn-save" onclick="saveProfile()">💾 Save Changes</button>
        </div>
      `;
    }

    async function saveProfile() {
        const packet = {
            allergies: document.getElementById('pAllergies').value,
            medical: document.getElementById('pMeds').value,
            contactName: document.getElementById('pName').value,
            contactPhone: document.getElementById('pPhone').value,
            lastUpdated: new Date().toISOString()
        };
        const json = JSON.stringify(packet).replace(/"/g, '\\"');
        await sendGQL(`mutation { updateStudentProfile(studentId: ${currentUserId}, dataJson: "${json}") }`);
        alert("Profile Updated!");
    }

    async function rsvp(eid) {
      const snack = prompt("What snacks do you prefer?", "Chips");
      if(!snack) return;

      const json = JSON.stringify({ snack, timestamp: new Date().toISOString() }).replace(/"/g, '\\"');

      // 1. Mongo (Snacks)
      await sendGQL(`mutation { submitCustomData(eventId: ${eid}, studentId: ${currentUserId}, dataJson: "${json}") }`);
      // 2. Redis (RSVP)
      await sendGQL(`mutation { rsvpStudent(eventId: ${eid}, studentId: ${currentUserId}) }`);

      alert("RSVP Sent! Leaders have been notified.");
    }

    init();
  </script>
</body>
</html>
