services:
  # Service 1: The MySQL Database
  db:
    image: mysql:8.0
    container_name: ygms-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3307:3306"
    volumes:
      # Persist data so it doesn't vanish when container stops
      - db_data:/var/lib/mysql

      # AUTOMATIC INIT: Maps SQL files to the startup folder.
      # Docker executes .sql files here in alphabetical order.
      # Prefix with numbers to ensure schema runs before data.
      - ./sql_files/YGMSSchema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./sql_files/YGMSData.sql:/docker-entrypoint-initdb.d/02_data.sql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
  mongo:
    image: mongo:latest
    container_name: ygms-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: .
    container_name: ygms-backend
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # OVERRIDE the localhost setting for Docker networking
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MONGO_HOST: mongo
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""

  redis:
    image: redis:alpine
    container_name: ygms-redis
    ports:
        - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
  mongo_data: