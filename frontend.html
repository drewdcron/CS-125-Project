<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YGMS Event Dashboard</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; padding: 20px; }

    .container { display: grid; grid-template-columns: 300px 1fr; gap: 20px; max-width: 1200px; margin: 0 auto; }
    .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    h2 { margin-top: 0; color: #444; border-bottom: 2px solid #5c7cfa; padding-bottom: 10px; }

    input { width: 100%; padding: 10px; margin-bottom: 10px; box-sizing: border-box; }
    button.action-btn { width: 100%; background: #5c7cfa; color: white; border: none; padding: 10px; cursor: pointer; border-radius: 5px; }
    button.action-btn:hover { background: #4263eb; }

    /* Roster Grid */
    .roster-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; }
    .student-card { background: #f8f9fa; border: 1px solid #ddd; padding: 15px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }

    /* Dynamic Buttons */
    .btn-checkin { background: #ccc; border: none; padding: 8px 15px; border-radius: 20px; cursor: pointer; color: #333; font-weight: bold; }
    .btn-checkin:hover { opacity: 0.8; }

    .status-in { background: #20c997; color: white; cursor: default; } /* Green */
  </style>
</head>
<body>

  <div class="container">

    <div>
      <div class="card">
        <h2>📅 Event Controls</h2>
        <label><strong>Current Event ID:</strong></label>
        <input type="number" id="eventId" value="101">
        <button class="action-btn" onclick="refreshDashboard()">Load Event Data</button>
      </div>

      <br>

      <div class="card">
        <h2>✨ New Event Type</h2>
        <input type="text" id="typeName" placeholder="Name (e.g. Retreat)">
        <button class="action-btn" onclick="createEventType()">Save to Mongo/MySQL</button>
        <p id="createMsg" style="font-size:0.8rem; color:green;"></p>
      </div>
    </div>

    <div class="card">
      <h2>👥 Live Check-In Roster</h2>
      <p>Click a button to check a student into Event <span id="displayEventId">101</span>.</p>
      <div id="roster" class="roster-grid">Loading...</div>
    </div>

  </div>

  <script>
    const API_URL = "/graphql";

    // 1. Fetch data from API
    async function sendGQL(query) {
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query: query })
      });
      return await response.json();
    }

    // 2. Main Refresh Logic
    async function refreshDashboard() {
      const eventId = document.getElementById('eventId').value;
      document.getElementById('displayEventId').innerText = eventId;
      const rosterDiv = document.getElementById('roster');

      // Query: Get All People (MySQL) AND Get List of Checked-In IDs (Redis)
      const query = `
        query {
          people { id name }
          eventAttendees(eventId: ${eventId})
        }
      `;

      try {
        const result = await sendGQL(query);
        const people = result.data.people;
        const attendees = result.data.eventAttendees; // Array of IDs [1, 5, ...]

        rosterDiv.innerHTML = '';

        people.forEach(p => {
          // Check if this person's ID exists in the Redis array
          const isCheckedIn = attendees.includes(p.id);

          // Style button based on status
          const btnClass = isCheckedIn ? "btn-checkin status-in" : "btn-checkin";
          const btnText = isCheckedIn ? "✅ Checked In" : "Check In";
          const action = isCheckedIn ? "" : `onclick="checkIn(${p.id})"`;

          const html = `
            <div class="student-card">
              <div>
                <strong>${p.name}</strong><br>
                <small>ID: ${p.id}</small>
              </div>
              <button class="${btnClass}" ${action}>${btnText}</button>
            </div>
          `;
          rosterDiv.innerHTML += html;
        });

      } catch (e) {
        console.error(e);
        rosterDiv.innerHTML = "Error loading data.";
      }
    }

    // 3. Mutation: Check In (Redis)
    async function checkIn(studentId) {
      const eventId = document.getElementById('eventId').value;
      const mutation = `
        mutation {
          checkInToEvent(eventId: ${eventId}, studentId: ${studentId})
        }
      `;
      await sendGQL(mutation);
      refreshDashboard(); // Reload to turn button green
    }

    // 4. Mutation: Create Event Type (Mongo)
    async function createEventType() {
      const name = document.getElementById('typeName').value;
      // Hardcoded schema for demo
      const schema = JSON.stringify([{ "field": "notes", "type": "text" }]);

      const mutation = `
        mutation {
          createEventType(name: "${name}", schemaJson: ${JSON.stringify(schema)})
        }
      `;
      const res = await sendGQL(mutation);
      document.getElementById('createMsg').innerText = res.data.createEventType;
    }

    // Load on start
    refreshDashboard();
  </script>
</body>
</html>
